[tools]
swiftformat = "0.64.0"

[tasks.format]
description = "Format Sources"
run = "swiftformat ."

[tasks.lint]
description = "Lint Sources"
run = "swiftformat . --lint"

[tasks.build]
description = "Build Calligraphy"
run = "swift build"

[tasks.test]
description = "Test Calligraphy"
run = "swift test"

[tasks.preview-docs]
description = "Preview Documentation"
run = "swift package --disable-sandbox preview-documentation --product Calligraphy"

[tasks.verify-tutorials]
description = "Compile and run the tutorial code listings"
run = "./.scripts/verify-tutorial-code"

[tasks.sync-tutorials]
description = "Regenerate the tutorial sample project and downloads from the listings"
run = "./.scripts/verify-tutorial-code --sync"
