name: Kill Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to withdraw, as MAJOR.MINOR.PATCH
        required: true
        type: string
      delete-branch:
        description: Also delete the release branch named after this version
        required: false
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  kill-release:
    name: Kill Release
    runs-on: ubuntu-latest
    steps:
      - name: Require Main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "releases are withdrawn from main, not ${GITHUB_REF_NAME}" >&2
          exit 1
      - name: Create App Token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Delete Release and Tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          DELETE_BRANCH: ${{ inputs.delete-branch }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$VERSION is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          exists() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/$1" --silent 2>/dev/null
          }
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release delete "$VERSION" --yes --cleanup-tag
            echo "Deleted the release and tag \`$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
          elif exists "tags/$VERSION"; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION" --silent
            echo "Deleted the tag \`$VERSION\`; it had no release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "there is no release or tag named $VERSION" >&2
            exit 1
          fi
          if exists "tags/$VERSION"; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION" --silent
          fi
          if [ "$DELETE_BRANCH" = "true" ]; then
            if exists "heads/release/$VERSION"; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release/$VERSION" --silent
              echo "Deleted the branch \`release/$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::there is no branch named release/$VERSION"
            fi
          fi
          {
            echo
            echo "Left alone: the version on \`main\`, the published website, and any release branch that was not deleted."
            echo "Run Set Version to change the version on \`main\`, and Publish Website to redeploy the site."
          } >> "$GITHUB_STEP_SUMMARY"
