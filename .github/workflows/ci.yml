name: Calligraphy CI
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches:
      - "main"
      - "*release*"
  pull_request:
    branches:
      - "main"
      - "*release*"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint Sources
    runs-on: xcode-27
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install Toolchain
      uses: jdx/mise-action@v4
      with:
        version: 2026.8.15
    - name: Select Xcode Version
      run: ./.scripts/xcode-select
    - name: Lint with SwiftFormat
      run: mise lint
  build-macos-spm:
    name: Build Calligraphy (macOS)
    strategy:
      matrix:
        swift: ['6.1', '6.2', '6.3', '6.4']
        include:
          - swift: '6.1'
            runner: 'macos-15'
            xcode: '16.4'
          - swift: '6.2'
            runner: 'macos-26'
            xcode: '26.5'
          - swift: '6.3'
            runner: 'macos-26'
            xcode: '26.5'
          - swift: '6.4'
            runner: 'xcode-27'
            xcode: '27.0'
    runs-on: ${{ matrix.runner }}
    outputs:
      artifact-name: macos-build
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Select Xcode Version
      run: ./.scripts/xcode-select ${{ matrix.xcode }}
    - name: Build Calligraphy
      run: swift build -v --build-tests --build-path .build
    - name: Compress Build
      run: zip -r build.zip .build
    - name: Upload Build
      uses: actions/upload-artifact@v7
      with:
        name: macos-build-${{ matrix.swift }}
        path: build.zip
  test-macos-spm:
    name: Test Calligraphy (macOS)
    strategy:
      matrix:
        swift: ['6.1', '6.2', '6.3', '6.4']
        include:
          - swift: '6.1'
            runner: 'macos-15'
            xcode: '16.4'
          - swift: '6.2'
            runner: 'macos-26'
            xcode: '26.5'
          - swift: '6.3'
            runner: 'macos-26'
            xcode: '26.5'
          - swift: '6.4'
            runner: 'xcode-27'
            xcode: '27.0'
    needs: build-macos-spm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Xcode Version
        run: ./.scripts/xcode-select ${{ matrix.xcode }}
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: macos-build-${{ matrix.swift }}
          path: .
      - name: Decompress Build
        run: unzip build.zip
      - name: Test Calligraphy
        run: swift test --skip-build
  build-ubuntu-spm:
    name: Build Calligraphy (Ubuntu)
    strategy:
      matrix:
        swift: ['6.1', '6.2', '6.3', '6.4']
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ubuntu-build
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Calligraphy
        run: swift build -v --build-tests --build-path .build
      - name: Install `zip`
        run: apt-get update && apt-get install -y zip
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-build-${{ matrix.swift }}
          path: build.zip
  test-ubuntu-spm:
    name: Test Calligraphy (Ubuntu)
    strategy:
      matrix:
        swift: ['6.1', '6.2', '6.3', '6.4']
    needs: build-ubuntu-spm
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-build-${{ matrix.swift }}
          path: .
      - name: Install `unzip`
        run: apt-get update && apt-get install -y unzip
      - name: Decompress Build
        run: unzip build.zip
      - name: Test Calligraphy
        run: swift test --skip-build
  lint-docc:
    name: Validate Documentation
    runs-on: xcode-27
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Select Xcode Version
      run: ./.scripts/xcode-select
    - name: Validate Documentation
      run: ./.scripts/lint-docc    
  validate-pr:
    name: Validate Pull Request
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - build-macos-spm
      - test-macos-spm
      - build-ubuntu-spm
      - test-ubuntu-spm
      - lint
      - lint-docc
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream jobs
        run: |
          # If any job failed, this status will not be 'success'
          if [[ "${{ needs.build-macos-spm.result }}" == "failure" ]] || \
             [[ "${{ needs.test-macos-spm.result }}" == "failure" ]] || \
             [[ "${{ needs.build-ubuntu-spm.result }}" == "failure" ]] || \
             [[ "${{ needs.test-ubuntu-spm.result }}" == "failure" ]] || \
             [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.lint-docc.result }}" == "failure" ]]; then
            echo "❌ Upstream job failed."
            exit 1
          else
            echo "✅ All required jobs completed successfully."
          fi
