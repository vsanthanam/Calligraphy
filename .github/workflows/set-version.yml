name: Set Version
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to set, as MAJOR.MINOR.PATCH
        required: true
        type: string
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  set-version:
    name: Set Version
    runs-on: xcode-27
    steps:
      - name: Require Main or a Release Branch
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/')
        run: |
          echo "the version is set on main or a release branch, not ${GITHUB_REF_NAME}" >&2
          exit 1
      - name: Create App Token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - name: Install Toolchain
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.15
      - name: Select Xcode Version
        run: ./.scripts/xcode-select
      - name: Validate Request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$VERSION is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          current="$(./.scripts/version current)"
          if [ "$VERSION" = "$current" ]; then
            echo "the version is already $VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION is already released" >&2
            exit 1
          fi
      - name: Set Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mise run set-version "$VERSION"
          mise lint
      - name: Commit and Push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          VERSION: ${{ inputs.version }}
        run: |
          id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update to version $VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Set the version on \`${GITHUB_REF_NAME}\` to \`$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
