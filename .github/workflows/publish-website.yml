name: Publish Website
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  check-latest:
    name: Check Latest Release
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Compare with Latest Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "release" ] || [ "$(gh release view --json tagName --jq .tagName)" = "$TAG" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is not the latest release, so the website is left alone"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
  build-docc:
    name: Build Documentation
    needs: check-latest
    if: needs.check-latest.outputs.deploy == 'true'
    runs-on: xcode-27
    outputs:
      artifact-name: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Xcode Version
        run: ./.scripts/xcode-select
      - name: Build Documentation
        run: ./.scripts/build-static-docc
      - name: Compress Documentation
        run: zip -r docs.zip docs
      - name: Upload Documentation
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs.zip
  build-jekyll:
    name: Build Website
    needs: build-docc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download Documentation
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: .
      - name: Decompress Documentation
        run: unzip docs.zip
      - name: Setup Jekyll Configuration
        run: ./.scripts/setup-theme
        shell: bash
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
  deploy:
    name: Deploy Website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-jekyll
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
